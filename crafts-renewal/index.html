.wrap{max-width:900px;margin:0 auto;padding:20px 16px 50px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:13px}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.plum b{color:var(--plum)}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:var(--ok)}
.upd{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input{flex:1 1 200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-weight:500;font-size:13px}
td.n{color:var(--muted);font-variant-numeric:tabular-nums;width:40px}td small{color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:7px;font-size:12.5px;white-space:nowrap}
.p-done{background:var(--ok-soft);color:var(--ok);font-weight:600}.p-sent{background:var(--plum-soft);color:var(--plum)}.p-no{background:var(--warn-soft);color:var(--warn)}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}}
